[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "toyeye"
version = "0.1.0"
description = "A 1D toy fly eye for practising self-supervised motion learning and neural probes"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib", "torch"]

[dependency-groups]
dev = ["pytest", "jupyterlab", "ipykernel", "tensorboard", "ruff"]

# Install a stage on demand, e.g. `uv sync --extra flyvis` (kept out of the default
# environment because flyvis and FlyGym are large and can pin their own versions).
[project.optional-dependencies]
flyvis = ["flyvis"]
flygym = ["flygym", "flyvis"]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
